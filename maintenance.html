<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fd">
<meta name="robots" content="noindex,nofollow">
<title>無法連上這個網站</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#f4f7fd}
body{color:#202124;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px}
.error-page{width:min(100%,600px);margin:0 auto;padding:72px 42px 48px}
.error-icon{display:block;width:42px;height:48px;margin:0 0 28px;color:#202124}
h1{margin:0 0 18px;font-size:28px;font-weight:400;line-height:1.25;letter-spacing:0}
.detail{margin:0 0 18px;color:#5f6368;font-size:14px;line-height:1.65}
.detail strong{color:#202124;font-weight:700}
.error-code{margin:0 0 30px;color:#5f6368;font-size:12px;line-height:1.5}
.reload{min-width:92px;height:38px;padding:0 19px;border:0;border-radius:19px;background:#1a73e8;color:#fff;font:500 14px Arial,"Noto Sans TC",sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(26,115,232,.24)}
.reload:active{background:#1558b0}
@media(max-width:520px){
  .error-page{width:280px;margin:0 auto;padding:38px 0 32px}
  .error-icon{width:30px;height:36px;margin-bottom:27px}
  h1{margin-bottom:14px;font-size:17px;line-height:1.35}
  .detail{font-size:11px}
  .detail{margin-bottom:12px;line-height:1.55}
  .error-code{margin-bottom:25px;font-size:9px}
  .reload{min-width:76px;height:31px;padding:0 15px;border-radius:16px;font-size:10px}
}
@media(max-width:330px){.error-page{width:210px}}
</style>
</head>
<body>
<main class="error-page">
  <svg class="error-icon" viewBox="0 0 48 56" aria-hidden="true">
    <path d="M9 3h21l9 9v41H9z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 3v10h9" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M17 24h4v5h-4zm11 0h4v5h-4z" fill="currentColor"/>
    <path d="M17 41c2-4 5-6 8-6s6 2 8 6" fill="none" stroke="currentColor" stroke-width="3"/>
  </svg>

  <h1>無法連上這個網站</h1>
  <p class="detail"><strong>shengzhan-yujun-site.vercel.app</strong> 的回應時間過長。</p>
  <p class="error-code">ERR_CONNECTION_TIMED_OUT</p>
  <button class="reload" type="button" onclick="location.reload()">重新載入</button>
</main>
</body>
</html>
