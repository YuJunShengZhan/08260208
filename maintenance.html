<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf8f5">
<meta name="robots" content="noindex,nofollow">
<title>網站暫時關閉</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light dark;--bg:#fdf8f5;--panel:#fff;--text:#4b3038;--muted:#98717d;--pink:#e8637a;--line:rgba(232,99,122,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1014;--panel:#2a1820;--text:#f5dde3;--muted:#c39aa6;--line:rgba(232,99,122,.28)}}
html,body{min-height:100%;background:var(--bg)}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
main{width:min(100%,390px);padding:42px 28px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 18px 55px rgba(80,35,48,.12)}
.heart{width:54px;height:54px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;background:rgba(232,99,122,.11);color:var(--pink);font-size:27px}
h1{font-family:"Noto Serif TC","PMingLiU",serif;font-size:25px;font-weight:700;letter-spacing:0;color:var(--pink)}
p{margin-top:12px;color:var(--muted);font-size:14px;line-height:1.8;letter-spacing:0}
</style>
</head>
<body>
<main>
  <div class="heart" aria-hidden="true">♡</div>
  <h1>網站暫時關閉</h1>
  <p>這裡目前休息中，之後再見。</p>
</main>
</body>
</html>
